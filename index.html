<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Studyhub — Learn Smart. Practice More. Achieve More.</title>
    <meta name="description" content="Premium educational platform for CBSE Class 10 Mathematics and Science. Comprehensive chapter notes, interactive quizzes, formulas, and PDF resources." />
    <meta property="og:title" content="Studyhub — CBSE Class 10 Math & Science" />
    <meta property="og:description" content="Learn Smart. Practice More. Achieve More. Chapter-wise notes, practice questions, quizzes, and PDF library for CBSE Class 10." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      // GitHub Pages relative URL normalization: ensures trailing slash on project repo URLs
      (function() {
        var path = window.location.pathname;
        if (!path.endsWith('/') && !path.endsWith('.html') && !path.split('/').pop().includes('.')) {
          window.location.replace(path + '/' + window.location.search + window.location.hash);
        }
      })();
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // If root index.html is accessed directly on GitHub Pages without running a build
      setTimeout(function() {
        var root = document.getElementById('root');
        if (root && root.childNodes.length === 0) {
          if (window.location.pathname.indexOf('/docs') === -1) {
            fetch('./docs/index.html', { method: 'HEAD' })
              .then(function(res) {
                if (res.ok) {
                  window.location.replace('./docs/' + window.location.search + window.location.hash);
                }
              })
              .catch(function() {});
          }
        }
      }, 1200);
    </script>
  </body>
</html>
